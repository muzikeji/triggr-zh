name: Build .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid xz libarchive

      - name: Set up Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
        env:
          THEOS: /Users/runner/theos

      - name: Download iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mv sdks-master/iPhoneOS16.5.sdk ./
          rm -rf sdks-master sdks.zip
        env:
          THEOS: /Users/runner/theos

      - name: Build package (arm64)
        run: |
          echo "== THEOS=$THEOS =="
          ls -la $THEOS/sdks/
          echo "== SDK check =="
          ls $THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/
          make package SYSROOT="$THEOS/sdks/iPhoneOS16.5.sdk" ISYSROOT="$THEOS/sdks/iPhoneOS16.5.sdk" FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64"
          ls -la packages/
          mkdir -p dist
          cp packages/*.deb dist/

      - name: Build package (arm64e)
        run: |
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control && rm -f control.bak
          make clean
          make package SYSROOT="$THEOS/sdks/iPhoneOS16.5.sdk" ISYSROOT="$THEOS/sdks/iPhoneOS16.5.sdk" FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64e"
          ls -la packages/
          cp packages/*.deb dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: triggr-zh-deb
          path: dist/*.deb

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.deb
          generate_release_notes: true
